<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototyp der Kartenverwaltung der Musterbank.">
  <title>Kartenverwaltung | Musterbank</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #17243b;
      background: #f3f6fb;
    }

    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem 1rem;
    }

    main {
      display: grid;
      flex: 1;
      width: min(100%, 42rem);
      margin: 0 auto;
      place-items: center;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 0.5rem 2rem #17243b18;
    }

    h1 {
      margin-top: 0;
    }

    footer {
      margin: 1rem auto 0;
      color: #53627a;
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Kartenverwaltung</h1>
  </main>
  <footer>Prototyp · Version 1.0.0</footer>
</body>
</html>
