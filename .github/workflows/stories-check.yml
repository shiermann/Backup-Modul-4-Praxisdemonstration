name: Prüfe User Stories

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stories-check:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: User Stories prüfen
        run: python3 .github/scripts/stories_check.py
